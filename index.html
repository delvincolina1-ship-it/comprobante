<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-x: hidden; }
        
        .contenedor { position: relative; width: 100vw; max-width: 400px; }
        
        /* Imagen mantenida tal cual */
        .imagen-fondo { width: 100%; display: block; }
        
        /* Posición del cuadro */
        .zona-datos { position: absolute; top: 32%; left: 8%; right: 8%; display: flex; flex-direction: column; }
        
        .fila { background: transparent !important; padding: 1px 0; margin-bottom: 1px; width: 100%; border: none !important; }
        
        /* Letra reducida un 10% (de 3.5vw a 3.15vw y de 3.8vw a 3.42vw) */
        .etiqueta { color: #005696; font-size: 3.15vw; font-weight: 600; font-family: sans-serif; }
        .dato, select { border: none; font-size: 3.42vw; color: #000; outline: none; font-weight: 300; font-family: sans-serif; background: transparent !important; width: 100%; appearance: none; padding: 0; }
    </style>
</head>
<body>

<div class="contenedor">
    <img src="1779597858640.jpg" class="imagen-fondo">
    
    <div class="zona-datos">
        <div class="fila"><div class="etiqueta">Monto (Bs.):</div><input class="dato" id="monto" value="150,00" oninput="formatearMonto(this)"></div>
        <div class="fila"><div class="etiqueta">Nro. de referencia:</div><input class="dato" id="ref" value=""></div>
        <div class="fila"><div class="etiqueta">Fecha y hora del envío:</div><input class="dato" id="fecha" value=""></div>
        <div class="fila"><div class="etiqueta">Cuenta origen:</div><input class="dato" value="Cta. Ahorro *1802"></div>
        <div class="fila"><div class="etiqueta">Beneficiario:</div><input class="dato" id="telf" value="0412-3268435" oninput="formatearTelf(this)"></div>
        <div class="fila"><div class="etiqueta">Documento de identidad:</div><input class="dato" id="cedula" value="V-20.144.019" oninput="formatearCedula(this)"></div>
        <div class="fila"><div class="etiqueta">Banco destino:</div>
            <select class="dato">
                <option>0102 - Banco De Venezuela S.a.c.a. Banco Universal.</option>
                <option>0104 - Venezolano De Crédito, S.a. Banco Universal.</option>
                <option>0105 - Banco Mercantil, C.a. S.a.c.a. Banco Universal.</option>
                <option>0108 - Banco Provincial, S.a. Banco Universal.</option>
                <option>0114 - Banco Del Caribe, C.a. Banco Universal.</option>
                <option>0115 - Banco Exterior, C.a. Banco Universal.</option>
                <option>0128 - Banco Caroni, C.a. Banco Universal.</option>
                <option>0134 - Banesco Banco Universal S.a.c.a.</option>
                <option>0137 - Banco Sofitasa Banco Universal, C.a.</option>
                <option>0138 - Banco Plaza, C.a.</option>
                <option>0146 - Banco De La Gente Emprendedora Bangente, C.a.</option>
                <option>0151 - Bfc Banco Fondo Comun C.a. Banco Universal.</option>
                <option>0156 - 100% Banco, Banco Comercial, C.a.</option>
                <option>0157 - Del Sur Banco Universal, C.a.</option>
                <option>0163 - Banco De La Tesoro, C.a. Banco Universal.</option>
                <option>0166 - Banco Agricola De Venezuela, C.a. Banco Universal.</option>
                <option>0168 - Bancrecer S.a. Banco De Desarrollo.</option>
                <option>0169 - R4, Banco Microfinanciero, C.a.</option>
                <option>0171 - Banco Activo, C.a. Banco Comercial.</option>
                <option>0172 - Bancamiga, Banco Universal.</option>
                <option>0174 - Banplus Banco Comercial, C.a.</option>
                <option>0175 - Banco Digital De Los Trabajadores.</option>
                <option>0177 - Banco De La Fuerza Armada Nacional Bolivariana, banco Universal, C.a.</option>
                <option>0178 - N58 Banco Digital.</option>
                <option>0191 - Banco Nacional Crédito, C.a. Banco Universal.</option>
            </select>
        </div>
    </div>
</div>

<script>
    document.getElementById('ref').value = Math.floor(Math.random() * 900000000000) + 100000000000;
    const ahora = new Date();
    document.getElementById('fecha').value = ahora.toLocaleDateString('es-VE') + ' a las ' + ahora.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    function formatearCedula(input) {
        let v = input.value.replace(/[^\d]/g, '');
        if (v.length > 8) v = v.substring(0, 8);
        let formatted = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        input.value = "V-" + formatted;
    }
    function formatearTelf(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 4) input.value = v.substring(0, 4) + '-' + v.substring(4, 11);
    }
    function formatearMonto(input) {
        let v = input.value.replace(/\D/g, '');
        input.value = (v / 100).toLocaleString('es-VE', {minimumFractionDigits: 2});
    }
</script>
</body>
</html>
